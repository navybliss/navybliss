<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
<style>
text{font-family:"Inter","Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
.t{font-size:15px;font-weight:700;fill:#e6edf3}.s{font-size:12.5px;fill:#8b949e}.m{font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:12px;fill:#7ee787}
.h{font-size:13px;font-weight:700;fill:#79c0ff;letter-spacing:.06em}.l{font-size:11.5px;fill:#d2a8ff}
.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}.net{fill:none;stroke:#1f6feb;stroke-width:2}.relay{fill:none;stroke:#d2a8ff;stroke-width:2;stroke-dasharray:6 5}
</style>
<rect width="820" height="400" rx="16" fill="#0d1117"/>
<text class="h" x="32" y="40">HOME LAB · ONE TAILNET (WIREGUARD MESH)</text>
<text class="s" x="32" y="60">Linux machines, ACL tags, Tailscale SSH. Jobs go where there is room; backups go to a second machine.</text>

<ellipse cx="410" cy="232" rx="118" ry="44" fill="#0d2a4d" stroke="#1f6feb" stroke-width="1.5"/>
<text class="t" x="410" y="228" text-anchor="middle">tailnet</text>
<text class="s" x="410" y="247" text-anchor="middle">direct UDP when possible</text>

<path class="net" d="M232 150 C 300 170, 330 190, 345 205"/>
<path class="net" d="M588 150 C 520 170, 490 190, 475 205"/>
<path class="net" d="M232 318 C 300 300, 330 280, 345 262"/>
<path class="relay" d="M588 318 C 520 300, 490 280, 475 262"/>
<text class="l" x="468" y="304" text-anchor="end">DERP relay when away</text>

<rect class="box" x="32" y="84" width="200" height="110" rx="12"/>
<text class="t" x="50" y="112">Desktop</text>
<text class="s" x="50" y="132">16 threads · GPU</text>
<text class="s" x="50" y="150">local AI models, heavy jobs</text>
<text class="m" x="50" y="176">fleet pick --vram 8G</text>

<rect class="box" x="588" y="84" width="200" height="110" rx="12"/>
<text class="t" x="606" y="112">Home server</text>
<text class="s" x="606" y="132">always on, systemd timers</text>
<text class="s" x="606" y="150">dashboard, task queue</text>
<text class="m" x="606" y="176">needs online:desktop</text>

<rect class="box" x="32" y="262" width="200" height="110" rx="12"/>
<text class="t" x="50" y="290">Standby node</text>
<text class="s" x="50" y="310">encrypted restic replica</text>
<text class="s" x="50" y="328">second copy, checked regularly</text>
<text class="m" x="50" y="354">restic copy · check</text>

<rect class="box" x="588" y="262" width="200" height="110" rx="12"/>
<text class="t" x="606" y="290">Laptop + phone</text>
<text class="s" x="606" y="310">same services from anywhere</text>
<text class="s" x="606" y="328">SSH via Tailscale SSH</text>
<text class="m" x="606" y="354">fleet ls</text>
</svg>
